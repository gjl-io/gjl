name: Public Repository Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install test dependencies
        run: python3 -m pip install --requirement tools/requirements.txt
      - name: Run public repository tests
        run: python3 -m unittest discover --start-directory tools --pattern 'test_*.py' --verbose
